services:

  # -------------------------
  # Frontend
  # -------------------------
  front:
    # L'image est construite à partir de notre propre Dockerfile.
    build:
      context: ./front
      dockerfile: Dockerfile

    # Pas de container_name ici.
    # Cela permet à Docker Compose de créer plusieurs instances
    # du frontend lors d'un scaling.
    #
    # Exemple :
    # docker compose up --scale front=3
    #
    # Docker créera alors automatiquement des conteneurs du type :
    # docker-front-1
    # docker-front-2
    # docker-front-3

    # Variables d'environnement récupérées depuis le fichier .env.
    environment:
      NODE_ENV: ${NODE_ENV}
      FRONT_PORT: ${FRONT_PORT}

    # Le port du frontend est uniquement disponible
    # à l'intérieur du réseau Docker.
    #
    # Aucune publication vers la machine hôte n'est nécessaire,
    # car l'utilisateur passe uniquement par Nginx.
    expose:
      - "${FRONT_PORT}"

    # Limitation des ressources attribuées à CHAQUE instance
    # du frontend.
    #
    # En cas de scaling à 3 instances, chaque conteneur
    # possède donc sa propre limite de 0.25 CPU et 128 Mo.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

    # Le frontend rejoint le réseau commun du projet.
    networks:
      - games-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # -------------------------
  # Backend
  # -------------------------
  back:
    # Construction de l'image Python / Flask personnalisée.
    build:
      context: ./back
      dockerfile: Dockerfile

    # Pas de container_name ici non plus.
    # Cela permet de lancer plusieurs instances du backend.
    #
    # Exemple :
    # docker compose up --scale back=3
    #
    # Docker Compose générera automatiquement
    # un nom différent pour chaque replica.

    # Variables d'environnement récupérées depuis le fichier .env.
    environment:
      FLASK_ENV: ${FLASK_ENV}
      BACK_PORT: ${BACK_PORT}

    # Le port Flask reste accessible uniquement
    # à l'intérieur du réseau Docker.
    expose:
      - "${BACK_PORT}"

    # Limitation appliquée à chaque instance du backend.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

    # Le backend rejoint le réseau commun.
    networks:
      - games-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # -------------------------
  # Reverse proxy
  # -------------------------
  proxy:
    # Construction de notre image Nginx personnalisée.
    build:
      context: ./server
      dockerfile: Dockerfile

    # Le proxy n'est pas scalé pour le moment.
    # On peut donc conserver un nom fixe.
    container_name: games-server-proxy

    # Le proxy est le seul service accessible depuis l'extérieur.
    #
    # APP_PORT correspond au port de la machine hôte.
    # PROXY_PORT correspond au port interne de Nginx.
    #
    # Exemple :
    # 8080:80
    ports:
      - "${APP_PORT}:${PROXY_PORT}"

    # Le proxy dépend du frontend et du backend.
    # Docker démarre donc ces services avant Nginx.
    #
    # Cette dépendance reste compatible avec le scaling :
    # les différents replicas appartiennent toujours
    # aux services "front" et "back".
    depends_on:
      front:
        condition: service_healthy
      back:
        condition: service_healthy

    # Nginx est léger et conserve les mêmes limites.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

    # Le proxy rejoint le même réseau Docker afin
    # de pouvoir contacter les services "front" et "back".
    networks:
      - games-network


# -------------------------
# Réseau Docker
# -------------------------

# Réseau privé permettant aux différents conteneurs
# de communiquer entre eux.
#
# Même avec plusieurs instances, Docker conserve
# le nom DNS du service :
#
# front
# back
#
# Les replicas restent donc accessibles via
# le nom logique de leur service.
networks:
  games-network:
    driver: bridge